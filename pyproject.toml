[tool.ruff]
line-length = 88
target-version = "py310"
src = ["evorl", "tests"]
include = ["evorl/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
extend-select = ["D"]

# On top of the Google convention, disable `D417`, which requires
# documentation for every function parameter.
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in public __init__ method
    "D417", # Requires documentation for every function parameter.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "evorl-jax"
authors = [{ name = "Bowen Zheng", email = "bowen.zheng@protonmail.com" }]
description = "An efficient Evolutionary Reinforcement Learning Framework on Jax"
readme = "README.md"
dynamic = ["version"]
requires-python = ">= 3.10"
license-files = ["LICENSE"]
keywords = ["jax", "reinforcement-learning", "evolutionary-computation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aim",
    "brax",
    "chex",
    "distrax",
    "flax",
    "tfp-nightly[jax]",
    # "evox<1.0.0",
    "gymnasium>=1.1.0",
    "hydra-core",
    "hydra-joblib-launcher",
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "numpy",
    "omegaconf",
    "optax",
    "orbax-checkpoint",
    "pandas",
    "scipy",
    "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/EMI-Group/evorl"
Documentation = "https://evorl.readthedocs.io/"
Repository = "https://github.com/EMI-Group/evorl"
Issues = "https://github.com/EMI-Group/evorl/issues"
Changelog = "https://github.com/EMI-Group/evorl/releases"

[project.optional-dependencies]
wandb = ["wandb"]
swanlab = ["swanlab"]
comet = ["comet_ml"]
neptune = ["neptune-scale"]
gymnax = ["gymnax"]
jumanji = ["jumanji"]
jaxmarl = ["jaxmarl"]
mujoco-playground = ["playground"]
envpool = ["envpool"]
gymnasium = ["gymnasium[atari,mujoco,classic-control,box2d]>=1.1.0"]
dev = [
    "furo",
    "myst-parser",
    "pre-commit",
    "pytest",
    "ruff",
    "sphinx",
    "sphinx-autodoc2",
    "sphinx-copybutton",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evorl", "evorl.*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "evorl.__version__"}
