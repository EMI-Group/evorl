name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      source-ref:
        description: Exact commit to build and test
        required: false
        type: string
        default: ""
      release-tag:
        description: Version tag to validate before publishing
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine ruff==0.17.1
      - name: Check critical Python errors
        run: |
          ruff check --select E9,F63,F7,F82 evorl tests
          ruff check scripts/check_dist.py
          ruff format --check scripts/check_dist.py
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Validate distributions and release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        jax-version: ["minimum", "latest"]
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Install built wheel with minimum JAX and Orbax
        if: matrix.jax-version == 'minimum'
        run: python -m pip install dist/*.whl pytest "jumanji>=1.1.2" "jaxmarl>=0.2.0" "jax==0.10.0" "jaxlib==0.10.0" "orbax-checkpoint==0.11.30"
      - name: Install built wheel with latest dependencies
        if: matrix.jax-version == 'latest'
        run: python -m pip install dist/*.whl pytest "jumanji>=1.1.2" "jaxmarl>=0.2.0"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c 'import evorl; from importlib.metadata import version; assert evorl.__version__ == version("evorl-jax"); print(evorl.__file__, evorl.__version__)'
      - name: Stage training helpers for regression tests
        run: cp -r scripts "$RUNNER_TEMP/scripts"
      - name: Run CPU unit tests against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_space.py" \
            "$GITHUB_WORKSPACE/tests/test_distribution.py" \
            "$GITHUB_WORKSPACE/tests/ec" \
            "$GITHUB_WORKSPACE/tests/networks" \
            "$GITHUB_WORKSPACE/tests/agents" \
            "$GITHUB_WORKSPACE/tests/rollout" \
            "$GITHUB_WORKSPACE/tests/evaluators" \
            "$GITHUB_WORKSPACE/tests/test_toolkits.py" \
            "$GITHUB_WORKSPACE/tests/test_metrics.py" \
            "$GITHUB_WORKSPACE/tests/test_recorders.py" \
            "$GITHUB_WORKSPACE/tests/test_accelerator_utils.py" \
            "$GITHUB_WORKSPACE/tests/test_jax_compatibility.py" \
            "$GITHUB_WORKSPACE/tests/test_orbax_utils.py" \
            "$GITHUB_WORKSPACE/tests/test_prng.py"
      - name: Check environment adapters
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_env_factory.py" \
            "$GITHUB_WORKSPACE/tests/test_host_envs.py" \
            "$GITHUB_WORKSPACE/tests/test_host_env_shapes.py" \
            "$GITHUB_WORKSPACE/tests/test_vector_rewards.py" \
            "$GITHUB_WORKSPACE/tests/test_jumanji_env.py" \
            "$GITHUB_WORKSPACE/tests/test_multi_agent_env.py" \
            "$GITHUB_WORKSPACE/tests/test_jaxmarl_env.py" \
            "$GITHUB_WORKSPACE/tests/test_jumanji_multi_agent.py" \
            "$GITHUB_WORKSPACE/tests/test_jumanji_autoreset.py" \
            "$GITHUB_WORKSPACE/tests/test_jumanji_catalog.py" \
            "$GITHUB_WORKSPACE/tests/test_brax_env.py::test_brax_fast"
      - name: Run distributed and workflow tests on two CPU devices
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib --cpu-devices=2 -m "not four_devices" \
            "$GITHUB_WORKSPACE/tests/distributed" \
            "$GITHUB_WORKSPACE/tests/workflows" \
            "$GITHUB_WORKSPACE/tests/replay_buffers"
      - name: Check VMA casts across two mesh axes
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib --cpu-devices=4 -m four_devices \
            "$GITHUB_WORKSPACE/tests/distributed"

  evox:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: ["minimum", "latest"]
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Install CPU PyTorch
        run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          "${{ matrix.dependencies == 'minimum' && 'torch==2.9.0' || 'torch' }}"
      - name: Install built wheel with the EvoX extra
        run: |
          wheels=(dist/*.whl)
          constraints=()
          if [[ "${{ matrix.dependencies }}" == "minimum" ]]; then
            constraints=(
              "jax==0.10.0" "jaxlib==0.10.0" "orbax-checkpoint==0.11.30"
              "torch==2.9.0" "evox==1.4.0"
            )
          fi
          python -m pip install "${wheels[0]}[evox]" pytest "${constraints[@]}"
      - name: Check optional dependencies and installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          python -I -c 'import evox, torch; from evorl.algorithms.contrib.evox.evox_workflow import EvoXWorkflow; print(torch.__version__, EvoXWorkflow.__module__)'
      - name: Run EvoX and Torch interoperability regressions
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib -m "not slow" \
            "$GITHUB_WORKSPACE/tests/evox" \
            "$GITHUB_WORKSPACE/tests/test_torch_utils.py"
