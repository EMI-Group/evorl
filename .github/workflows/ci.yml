name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      source-ref:
        description: Exact commit to build and test
        required: false
        type: string
        default: ""
      release-tag:
        description: Version tag to validate before publishing
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install build twine ruff==0.15.7
      - name: Check critical Python errors
        run: |
          ruff check --select E9,F63,F7,F82 evorl
          ruff check scripts/check_dist.py
          ruff format --check scripts/check_dist.py
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Validate distributions and release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag || '' }}
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        jax-version: ["minimum", "latest"]
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Install built wheel with minimum JAX and Orbax
        if: matrix.jax-version == 'minimum'
        run: python -m pip install dist/*.whl pytest "jax==0.7.1" "jaxlib==0.7.1" "orbax-checkpoint==0.11.30"
      - name: Install built wheel with latest dependencies
        if: matrix.jax-version == 'latest'
        run: python -m pip install dist/*.whl pytest
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c 'import evorl; from importlib.metadata import version; assert evorl.__version__ == version("evorl-jax"); print(evorl.__file__, evorl.__version__)'
      - name: Stage training helpers for regression tests
        run: cp -r scripts "$RUNNER_TEMP/scripts"
      - name: Run CPU unit tests against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_space.py" \
            "$GITHUB_WORKSPACE/tests/test_distribution.py" \
            "$GITHUB_WORKSPACE/tests/test_ec_operator.py" \
            "$GITHUB_WORKSPACE/tests/test_ec_utils.py" \
            "$GITHUB_WORKSPACE/tests/test_toolkits.py" \
            "$GITHUB_WORKSPACE/tests/test_recorders.py" \
            "$GITHUB_WORKSPACE/tests/test_accelerator_utils.py" \
            "$GITHUB_WORKSPACE/tests/test_jax_compatibility.py" \
            "$GITHUB_WORKSPACE/tests/test_orbax_utils.py" \
            "$GITHUB_WORKSPACE/tests/test_prng.py" \
            "$GITHUB_WORKSPACE/tests/test_explicit_sharding.py" \
            "$GITHUB_WORKSPACE/tests/test_workflow_multidevice.py"
