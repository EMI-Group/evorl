name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the existing release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Invalid version tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ needs.resolve.outputs.tag }}
      source-ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evorl-jax/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub Release with distribution assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Keep release assets aligned with the distributions from this run.
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
