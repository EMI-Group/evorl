# @package _global_
defaults:
  - /agent/multi_objective/moppo
  - _self_
workflow_cls: evorl.algorithms.multi_objective.pgmorl.PGMORLWorkflow
pop_size: 6
warmup_iterations: 80
evolutionary_iterations: 20
weight_divisions: 10
performance_buffer_divisions: 10
performance_buffer_size: 2
archive_capacity: 128
reference_point: [-1000.0, -1000.0]
sparsity_coef: -1.0
predictor_sigma: 0.03
predictor_neighborhood: 0.1
eval_discount: ${discount}
total_timesteps: 10000000
