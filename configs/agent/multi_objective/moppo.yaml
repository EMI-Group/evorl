# @package _global_
workflow_cls: evorl.algorithms.multi_objective.moppo.MOPPOWorkflow
num_envs: 16
rollout_length: 128
total_timesteps: 1000000
normalize_obs: true
discount: 0.99
gae_lambda: 0.95
preferences: null
clip_epsilon: 0.2
normalize_gae: true
clip_value_loss: true
minibatch_size: 256
reuse_rollout_epochs: 10
optimizer:
  lr: 0.0003
  grad_clip_norm: 0.5
loss_weights:
  actor_loss: 1.0
  critic_loss: 0.5
  actor_entropy: -0.0
agent_network:
  actor_hidden_layer_sizes: [64, 64]
  critic_hidden_layer_sizes: [64, 64]
num_eval_envs: 16
eval_episodes: 32
eval_interval: 10
eval_discount: 1.0
